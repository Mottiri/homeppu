name: homeppu
description: "ほめっぷ - 世界一優しいSNS。承認欲求による疲弊を解消し、自己肯定感を最大化する。"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # Firebase
  firebase_core: ^4.6.0
  firebase_auth: ^6.3.0
  cloud_firestore: ^6.2.0
  firebase_storage: ^13.2.0
  firebase_app_check: ^0.4.2
  
  # 状態管理
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  
  # ルーティング
  go_router: ^14.8.1
  
  # UI/UX
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  
  # ユーティリティ
  intl: ^0.20.2
  uuid: ^4.5.2
  timeago: ^3.7.0
  image_picker: ^1.1.2
  shared_preferences: ^2.5.3
  google_generative_ai: ^0.4.7
  cloud_functions: ^6.1.0
  file_picker: ^10.3.7
  firebase_messaging: ^16.1.3
  flutter_local_notifications: ^19.5.0
  image_cropper: ^11.0.0
  nsfw_detector_flutter: ^1.0.5
  path: ^1.9.0
  path_provider: ^2.1.5
  confetti: ^0.8.0
  palette_generator: ^0.3.3+4
  purchases_flutter: ^9.11.0
  url_launcher: ^6.3.0
  google_mobile_ads: ^5.1.0
  flutter_markdown: ^0.7.7+1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.4
  build_runner: ^2.4.15
  json_serializable: ^6.9.4
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.5

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/logo_trimmed.png"
  adaptive_icon_foreground: "assets/icons/logo_trimmed.png"
  adaptive_icon_background: "#FFFFFF"
  remove_alpha_ios: true
  min_sdk_android: 21

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/icons/app_icon.png"
  android_12:
    color: "#FFFFFF"
    icon_background_color: "#FFFFFF"
    image: "assets/icons/app_icon.png"
  ios: true
  android: true

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/images/headers/
    - assets/icons/
    - assets/avatars/
    - assets/avatars/base/
    - assets/avatars/hair/
    - assets/avatars/eyes/
    - assets/avatars/mouth/
    - assets/avatars/eyebrows/
    - assets/reactions/
    - assets/stamp_sheets/
    - assets/stamp_sheets/layouts/
    - assets/onbord/
    - assets/campaigns/
    - docs/HELP.md
    - docs/TERMS_OF_SERVICE.md
    - docs/PRIVACY_POLICY.md
  
  # フォントはGoogle Fontsパッケージで動的に読み込み
